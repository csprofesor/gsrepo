name: CloudStream Derleyici

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: src
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: builds
          path: builds
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Tüm CloudStream Eklentilerini Derle
        working-directory: src
        run: ./gradlew make --stacktrace

      - name: "'build' Derlemelerini Yükle"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/builds"
          find . -maxdepth 1 -name "*.cs3" -type f -delete
          find "$GITHUB_WORKSPACE/src" -mindepth 2 -path "*/build/*.cs3" -type f -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          builds_dir = Path.cwd()
          src_dir = Path.cwd().parent / 'src'
          manifest = builds_dir / 'plugins.json'
          src_manifest = src_dir / 'plugins.json'

          data = []
          if manifest.exists():
              try:
                  data = json.loads(manifest.read_text(encoding='utf-8'))
              except Exception:
                  data = []

          src_data = []
          if src_manifest.exists():
              try:
                  src_data = json.loads(src_manifest.read_text(encoding='utf-8'))
              except Exception:
                  src_data = []

          if not isinstance(data, list):
              data = []
          if not isinstance(src_data, list):
              src_data = []

          # Map existing entries by internalName
          entries = {item['internalName']: item for item in data if isinstance(item, dict) and 'internalName' in item}

          # Merge entries from src/plugins.json
          for item in src_data:
              if isinstance(item, dict) and 'internalName' in item:
                  name = item['internalName']
                  if name not in entries:
                      entries[name] = item

          built = {p.stem: p for p in builds_dir.glob('*.cs3')}

          final_data = []
          for name, target in built.items():
              if name in entries:
                  item = entries[name]
              else:
                  item = {
                      "url": f"https://raw.githubusercontent.com/csprofesor/gsrepo/builds/{target.name}",
                      "status": 1,
                      "version": 1,
                      "name": name,
                      "internalName": name,
                      "authors": ["csprofesor"],
                      "description": f"{name} eklentisi",
                      "repositoryUrl": "https://github.com/csprofesor/gsrepo",
                      "language": "tr",
                      "tvTypes": ["Movie", "TvSeries"],
                      "iconUrl": f"https://www.google.com/s2/favicons?domain=github.com&sz=%size%",
                      "apiVersion": 1
                  }
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              item['fileSize'] = target.stat().st_size
              item['fileHash'] = f'sha256-{digest}'
              item['url'] = f'https://raw.githubusercontent.com/csprofesor/gsrepo/builds/{target.name}?v={digest}'
              final_data.append(item)

          final_data.sort(key=lambda x: x.get('name', '').lower())
          manifest.write_text(json.dumps(final_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "Yüklenecek değişiklik yok, atlanıyor."
          else
            git commit -m "Otomatik eklenti derlemesi: $GITHUB_SHA"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            for deneme in 1 2 3; do
              git fetch origin builds
              if git rebase origin/builds; then
                if git push origin HEAD:builds; then
                  echo "builds dalına başarıyla yüklendi."
                  break
                fi
              else
                echo "Rebase çakışması, origin/builds üzerine soft-reset ile yeniden deneniyor..."
                git rebase --abort || true
                git fetch origin builds
                git reset --soft origin/builds
                git add -A
                git commit -m "Otomatik eklenti derlemesi: $GITHUB_SHA" || true
                if git push origin HEAD:builds; then
                  echo "builds dalına soft-reset sonrası başarıyla yüklendi."
                  break
                fi
              fi
            done
          fi

      - name: "Repo manifest cache-buster güncelle"
        run: |
          echo "Repo manifest cache-buster adımı atlandı; plugins.json içindeki SHA256 URL'leri zaten benzersiz cache-buster sağlıyor."
