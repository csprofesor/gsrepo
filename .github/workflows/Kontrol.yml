name: Domain Değişiklik Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'KONTROL.py'
      - '.github/workflows/Kontrol.yml'
  schedule:
    - cron: 11 */9 * * *

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4
      - name: Python 3.11.8 Yükle
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.8
      - name: Python Sürümünü Göster
        run: python -c "import sys; print(sys.version)"
      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel Kekik cloudscraper
      - name: Betiği Çalıştır
        run: python KONTROL.py
      - name: Değişiklik Kontrolü
        id: degisiklik_kontrol
        run: |
          if git diff --quiet .; then
            echo "degisiklik=false" >> "$GITHUB_OUTPUT"
          else
            echo "degisiklik=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Değişiklikleri Commit ve Push Yap
        if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "♻️ Domain Değişikliği" -m "🔄 Otomatik domain güncellemeleri yapıldı."
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin master
